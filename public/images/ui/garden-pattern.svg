<svg xmlns="http://www.w3.org/2000/svg" width="920" height="920" viewBox="0 0 920 920" fill="none">
  <!--
    Subtle botanical line-art pattern.
    Designed to be used as a repeating background image.
  -->
  <defs>
    <pattern id="p" width="460" height="460" patternUnits="userSpaceOnUse">
      <rect width="460" height="460" fill="transparent"/>

      <!-- Vines -->
      <path d="M36 420c70-62 132-95 222-116 98-23 154-74 186-166" stroke="#1e3a2f" stroke-opacity="0.10" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M424 438c-48-74-118-126-214-150C120 266 70 222 42 140" stroke="#1e3a2f" stroke-opacity="0.09" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M220 28c14 94 64 152 144 188 86 38 136 90 160 190" stroke="#1e3a2f" stroke-opacity="0.09" stroke-width="1.1" stroke-linecap="round"/>

      <!-- Leaf clusters -->
      <g stroke="#233129" stroke-opacity="0.10" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <!-- Cluster A -->
        <path d="M120 98c22 8 38 22 46 40-26 0-48-14-60-32 2-4 7-7 14-8z"/>
        <path d="M168 146c22 6 40 20 52 40-26 2-50-10-64-28 1-4 6-9 12-12z"/>
        <path d="M116 154c14 14 22 32 22 52-22-12-36-34-38-54 4-2 10-2 16 2z"/>

        <!-- Cluster B -->
        <path d="M332 108c-22 8-38 22-46 40 26 0 48-14 60-32-2-4-7-7-14-8z"/>
        <path d="M284 156c-22 6-40 20-52 40 26 2 50-10 64-28-1-4-6-9-12-12z"/>
        <path d="M340 164c-14 14-22 32-22 52 22-12 36-34 38-54-4-2-10-2-16 2z"/>

        <!-- Cluster C -->
        <path d="M118 320c26-18 52-20 76-8-18 22-46 34-74 28-4-6-4-14-2-20z"/>
        <path d="M194 304c20-18 44-24 70-20-12 26-34 46-62 50-6-4-10-16-8-30z"/>
        <path d="M156 372c10-24 28-40 52-50 0 28-12 56-32 72-8-2-16-10-20-22z"/>

        <!-- Cluster D -->
        <path d="M340 320c-26-18-52-20-76-8 18 22 46 34 74 28 4-6 4-14 2-20z"/>
        <path d="M264 304c-20-18-44-24-70-20 12 26 34 46 62 50 6-4 10-16 8-30z"/>
        <path d="M302 372c-10-24-28-40-52-50 0 28 12 56 32 72 8-2 16-10 20-22z"/>
      </g>

      <!-- Dots (pollen) -->
      <g fill="#1e3a2f" fill-opacity="0.08">
        <circle cx="62" cy="56" r="2"/>
        <circle cx="390" cy="66" r="1.6"/>
        <circle cx="92" cy="228" r="1.4"/>
        <circle cx="374" cy="236" r="2.2"/>
        <circle cx="82" cy="396" r="1.8"/>
        <circle cx="410" cy="392" r="1.4"/>
      </g>
    </pattern>
  </defs>

  <rect width="920" height="920" fill="url(#p)"/>
</svg>
